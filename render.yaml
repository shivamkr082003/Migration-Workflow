# One-click deploy on Render: a Docker web service plus a managed Postgres database.
services:
  - type: web
    name: migration-workbench
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: migration-workbench-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: info
databases:
  - name: migration-workbench-db
    plan: free
